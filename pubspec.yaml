name: unimarket
description: Campus peer-to-peer academic buy and rent marketplace.
publish_to: 'none'
version: 1.0.3+4
environment:
  sdk: '>=3.12.2 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  firebase_core: ^4.0.0
  firebase_auth: ^6.0.0
  cloud_firestore: ^6.0.0
  image: ^4.5.4
  image_picker: ^1.2.0
  shared_preferences: ^2.5.3
  intl: ^0.20.2
  pdf: ^3.13.1
  printing: ^5.15.1
  record: ^7.1.2
  audioplayers: ^6.8.1
  web: ^1.1.1
dev_dependencies:
  integration_test:
    sdk: flutter
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
flutter:
  uses-material-design: true
  assets:
    - assets/fonts/NotoSans-Regular.ttf
